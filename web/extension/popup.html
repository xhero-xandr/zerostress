<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZeroStress</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" width="20" height="20"> ZeroStress</h1>
  <p class="hint">Opens the link in a disposable microVM at zerostress.space, never on this device. This extension does not read your pages.</p>
  <form id="form">
    <label for="url">Link to check</label>
    <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="https://">
    <button type="submit">Open in ZeroStress</button>
    <p id="error" class="error" hidden>That is not a web address (http or https).</p>
  </form>
</body>
</html>
