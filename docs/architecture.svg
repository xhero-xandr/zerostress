<circle cx="304" cy="316" r="10" fill="#1d4ed8"/>
<text x="304" y="320" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="304" cy="558" r="10" fill="#1d4ed8"/>
<text x="304" y="562" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="944" cy="84" r="10" fill="#1d4ed8"/>
<text x="944" y="88" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
